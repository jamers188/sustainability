<!DOCTYPE html>
<html lang="en" style="color-scheme:light only">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="color-scheme" content="light only"/>
<title>DAMAC AI Call Review</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px;line-height:1.5}
:root{--gold:#b8943a;--gl:rgba(5, 4, 2, 0.12);--gb:rgba(184,148,58,0.3);--sf:#fff;--s2:#f8f9fa;--br:rgba(0,0,0,0.07);--br2:rgba(0,0,0,0.13);--tx:#1a1a2e;--t2:#6b7280;--t3:#9ca3af;--gn:#16a34a;--am:#ca8a04;--rd:#dc2626;--bl:#0ea5e9;--gnb:rgba(22,163,74,0.08);--amb:rgba(202,138,4,0.08);--rdb:rgba(220,38,38,0.08);--blb:rgba(14,165,233,0.08);--r:10px;--rs:6px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:252px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--br);display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:14px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.sb-mk{width:34px;height:34px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.sb-ti{font-size:13px;font-weight:600}
.sb-st{font-size:11px;margin-top:2px}
.sb-sec{padding:12px 14px 5px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.sb-nav{list-style:none;padding:0 8px}
.sb-nav li a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);font-size:13px;color:var(--t2);cursor:pointer;transition:all .15s;user-select:none}
.sb-nav li a:hover{background:var(--s2);color:var(--tx)}
.sb-nav li a.on{background:var(--gl);color:var(--gold);font-weight:600}
.sb-div{height:1px;background:var(--br);margin:6px 14px}
.sb-fl-wrap{padding:6px 12px;flex:1;overflow-y:auto}
.sb-fl{margin-bottom:12px}
.sb-fl-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.sb-fl select,.sb-fl input{width:100%;font-size:12px;padding:7px 9px;border-radius:var(--rs);border:1px solid var(--br2);background:var(--s2);color:var(--tx);outline:none;appearance:none}
.sb-fl select:focus,.sb-fl input:focus{border-color:var(--gold)}
.qf{width:100%;padding:7px 10px;border-radius:var(--rs);font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--br);background:transparent;color:var(--t2);text-align:left;margin-bottom:3px;display:flex;align-items:center;gap:6px;transition:all .15s}
.qf:hover{background:var(--s2)}.qf.qa{background:var(--rdb);border-color:rgba(220,38,38,.25);color:var(--rd)}.qf.qt{background:var(--gnb);border-color:rgba(22,163,74,.25);color:var(--gn)}.qf.qb{background:var(--blb);border-color:rgba(14,165,233,.25);color:var(--bl)}
.clr{width:100%;margin-top:6px;padding:7px;border-radius:var(--rs);font-size:11px;cursor:pointer;border:1px solid var(--br);background:transparent;color:var(--t3)}
.main{flex:1;overflow-y:auto;padding:20px 24px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.sc{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:14px 16px}
.sc-l{font-size:11px;color:var(--t2);margin-bottom:5px}.sc-v{font-size:24px;font-weight:700;line-height:1}.sc-s{font-size:11px;color:var(--t3);margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:5px 12px;border-radius:999px;font-size:11px;cursor:pointer;border:1px solid var(--br);background:var(--sf);color:var(--t2);transition:all .15s}
.pill:hover{border-color:var(--gb)}.pill.on{background:var(--gl);border-color:var(--gb);color:var(--gold);font-weight:600}
.spill{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--br);background:var(--sf);color:var(--t2);transition:all .15s}
.spill.s-all.on{background:var(--gl);border-color:var(--gb);color:var(--gold)}.spill.s-top.on{background:var(--gnb);border-color:rgba(22,163,74,.3);color:var(--gn)}.spill.s-above.on{background:var(--blb);border-color:rgba(14,165,233,.3);color:var(--bl)}.spill.s-avg.on{background:var(--amb);border-color:rgba(202,138,4,.3);color:var(--am)}.spill.s-below.on{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.3);color:#ea580c}.spill.s-crit.on{background:var(--rdb);border-color:rgba(220,38,38,.3);color:var(--rd)}
.dos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.dos-card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .2s}
.dos-card:hover{border-color:var(--gb);box-shadow:0 2px 10px rgba(0,0,0,.06);transform:translateY(-1px)}
.tbl-wrap{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:9px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--br);background:var(--s2);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--br);font-size:12px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfc;cursor:pointer}
.pg-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--br);background:var(--s2);font-size:12px;color:var(--t2)}
.pg-btns{display:flex;gap:4px}
.pg-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--br);background:var(--sf);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pg-btn:hover,.pg-btn.on{border-color:var(--gold);color:var(--gold);background:var(--gl)}
.score-b{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700}
.sg{background:var(--gnb);color:var(--gn)}.sw{background:var(--amb);color:var(--am)}.sr{background:var(--rdb);color:var(--rd)}.sb2{background:var(--blb);color:var(--bl)}
.op{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600}
.o-book{background:var(--gnb);color:var(--gn)}.o-int{background:var(--amb);color:var(--am)}.o-no{background:var(--rdb);color:var(--rd)}.o-tr{background:var(--blb);color:var(--bl)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--gl);color:var(--gold)}
.card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--br);background:var(--s2);display:flex;align-items:center;justify-content:space-between}
.card-ti{font-size:14px;font-weight:600}.card-su{font-size:11px;color:var(--t2);margin-top:2px}
.card-body{padding:16px 18px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.three-box{padding:14px;background:var(--s2);border-radius:var(--rs)}
.three-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--br)}
.three-hd-ic{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.three-hd-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.three-item{padding:7px 0;border-bottom:1px solid var(--br);font-size:12px;line-height:1.5}
.three-item:last-child{border-bottom:none;padding-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;flex-shrink:0}
/* DEEP DIVE HEADER */
.dd-hd{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:24px;margin-bottom:14px}
.dd-name{font-size:28px;font-weight:700;margin-bottom:4px}
.dd-sub{font-size:13px;color:var(--t2);margin-bottom:16px}
.dd-meta{display:flex;gap:28px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--br)}
.dd-m-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px}
.dd-m-val{font-size:13px;font-weight:600}
.dd-selectors{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.dd-sel-lbl{font-size:11px;font-weight:600;color:var(--t2);margin-right:4px}
.dd-sel{font-size:12px;padding:7px 12px;border-radius:var(--rs);border:1px solid var(--br2);background:var(--s2);color:var(--tx);outline:none;cursor:pointer;min-width:160px}
.dd-sel:focus{border-color:var(--gold)}
.dd-big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.dd-big-c{background:var(--s2);border-radius:var(--rs);padding:18px}
.dd-big-lbl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.dd-big-num{font-size:44px;font-weight:700;line-height:1;letter-spacing:-2px}
.dd-big-sub{font-size:11px;color:var(--t2);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.dd-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.dd-kpi{background:var(--s2);border-radius:var(--rs);padding:12px;text-align:center}
.dd-kpi-v{font-size:22px;font-weight:700;color:var(--gold)}.dd-kpi-l{font-size:10px;color:var(--t2);margin-top:3px;line-height:1.3}
.tabs{display:flex;gap:2px;background:var(--s2);padding:4px;border-radius:var(--rs);margin-bottom:16px;width:fit-content}
.tab{padding:7px 16px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--t2);transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--tx)}.tab.on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.info-box{background:var(--sf);border:1px solid var(--br);border-radius:var(--rs);padding:16px}
.info-box-ti{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--br);font-size:12px}
.info-row:last-child{border-bottom:none}
.info-k{color:var(--t2);flex-shrink:0;margin-right:12px}.info-v{font-weight:500;text-align:right}
.list-item{display:flex;align-items:flex-start;gap:7px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--br);line-height:1.5}
.list-item:last-child{border-bottom:none}
.sc-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--br);font-size:12px}
.sc-row:last-child{border-bottom:none;padding-bottom:0}
.sc-name{width:160px;flex-shrink:0;color:var(--t2);font-size:11px}
.sc-bar{flex:1;height:7px;background:var(--br);border-radius:3px;overflow:hidden}
.sc-fill{height:100%;border-radius:3px}
.sc-val{width:45px;text-align:right;font-weight:700;font-size:12px}
.sc-comment{font-size:11px;line-height:1.5;padding:4px 0 8px 170px;color:var(--t2);border-bottom:1px solid var(--br)}
.flag{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-radius:var(--rs);margin-bottom:6px;font-size:12px;font-weight:500}
.dim-row{border-bottom:1px solid var(--br)}
.dim-row:last-child{border-bottom:none}
.dim-hd{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;transition:background .15s}
.dim-hd:hover{background:#fafbfc}
.dim-label{min-width:180px;flex-shrink:0}
.dim-nm{font-size:13px;font-weight:500}.dim-ds{font-size:11px;color:var(--t3);margin-top:1px}
.dim-bar-w{flex:1;height:8px;background:var(--br);border-radius:4px;overflow:hidden}
.dim-bar-f{height:100%;border-radius:4px;transition:width .4s}
.dim-sc{font-size:14px;font-weight:700;min-width:55px;text-align:right}
.dim-sp{font-size:10px;color:var(--t3);min-width:150px;text-align:right;white-space:nowrap}
.dim-ms{font-size:11px;min-width:65px;text-align:right;font-weight:600}
.dim-ar{font-size:12px;color:var(--t3);margin-left:4px}
.dim-det{display:none;padding:0 18px 16px;background:#fafbfc;border-top:1px solid var(--br)}
.dim-why{padding:10px 14px;border-radius:var(--rs);margin-bottom:10px;font-size:12px;line-height:1.6}
.dim-chk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.chk{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--rs);border:1px solid transparent}
.chk-ic{font-size:14px;flex-shrink:0;margin-top:1px}.chk-tx{font-size:12px;line-height:1.5}
/* TIMELINE */
.tl-row{display:flex;gap:12px;margin-bottom:14px;position:relative}
.tl-row::before{content:'';position:absolute;left:14px;top:34px;bottom:-14px;width:1px;background:var(--br)}
.tl-row:last-child::before{display:none}
.tl-sp{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;z-index:1}
.tl-body{flex:1;background:var(--s2);border-radius:var(--rs);padding:12px 14px}
.tl-hl{font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tl-time{font-size:10px;color:var(--t3);font-weight:400}
.tl-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tl-text{font-size:11px;color:var(--t2);line-height:1.55}
.tl-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:5px;font-weight:500}
/* CONVERSATION BUBBLES */
.conv-block{margin:10px 0;padding:12px 14px;background:#fff;border:1px solid var(--br);border-radius:var(--rs)}
.conv-block-hd{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.conv-msg{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.conv-msg:last-child{margin-bottom:0}
.conv-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#fff}
.conv-av-rm{background:var(--gold)}
.conv-av-cu{background:var(--bl)}
.conv-bubble{flex:1;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;position:relative}
.conv-bubble-rm{background:rgba(184,148,58,.08);border:1px solid rgba(184,148,58,.2);border-left:3px solid var(--gold)}
.conv-bubble-rm.bad{background:rgba(220,38,38,.06);border-color:rgba(220,38,38,.2);border-left-color:var(--rd)}
.conv-bubble-rm.good{background:rgba(22,163,74,.06);border-color:rgba(22,163,74,.2);border-left-color:var(--gn)}
.conv-bubble-cu{background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.2);border-left:3px solid var(--bl)}
.conv-speaker{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.conv-quote{font-style:italic;color:var(--tx);font-size:13px;line-height:1.65}
.conv-issue{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.08);font-size:11px;font-style:normal;color:var(--t2);line-height:1.5}
.conv-issue.bad{color:var(--rd)}
.conv-issue.good{color:var(--gn)}
.conv-correct{margin-top:8px;padding:8px 12px;background:rgba(22,163,74,.05);border:1px dashed rgba(22,163,74,.3);border-radius:6px;font-size:12px;color:var(--gn);line-height:1.6}
.conv-correct-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gn);margin-bottom:3px}
/* LEADERBOARD POPUP */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--sf);border-radius:var(--r);width:100%;max-width:640px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
.modal-hd{padding:18px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between}
.modal-ti{font-size:16px;font-weight:600}
.modal-cl{width:28px;height:28px;border-radius:6px;border:1px solid var(--br);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--t2)}
.modal-body{padding:20px;overflow-y:auto}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--br);cursor:pointer}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:var(--s2);margin:0 -20px;padding:12px 20px;border-radius:var(--rs)}
.lb-rank{width:32px;text-align:center;font-size:16px;flex-shrink:0}
.lb-info{flex:1}
.lb-name{font-size:13px;font-weight:600}
.lb-sub{font-size:11px;color:var(--t2);margin-top:2px}
.lb-score{font-size:18px;font-weight:700}
.back-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);cursor:pointer;margin-bottom:16px}
.back-btn:hover{color:var(--tx)}
.attn-box{padding:12px 16px;background:var(--rdb);border:1px solid rgba(220,38,38,.2);border-radius:var(--rs);margin-bottom:14px;font-size:12px;color:var(--rd);display:flex;align-items:center;gap:10px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="sb" id="sb"></div>
  <div class="main" id="main"></div>
</div>
<div class="overlay" id="lb-overlay" style="display:none" onclick="if(event.target===this)closeLB()">
  <div class="modal">
    <div class="modal-hd">
      <div><div class="modal-ti" id="lb-title">Agent Leaderboard</div><div style="font-size:11px;color:var(--t2);margin-top:2px" id="lb-sub"></div></div>
      <div class="modal-cl" onclick="closeLB()">✕</div>
    </div>
    <div class="modal-body" id="lb-body"></div>
  </div>
</div>


<script> 
const WEBHOOK='https://aihub.damacgroup.com/webhook/damac-call-reviews'
const DETAIL_WEBHOOK='https://aihub.damacgroup.com/webhook/damac-call-detail';
const DIMS=[
  {id:'greeting',label:'Opening & Greeting',max:10,desc:'Energy, name, introduce self + role'},
  {id:'profiling',label:'Client Profiling',max:15,desc:'Financial capacity, decision-maker, rapport'},
  {id:'probing',label:'Requirement ID',max:20,desc:'Budget, type, location, timeline, summarize first'},
  {id:'presentation',label:'Project Presentation',max:15,desc:'Max 2 projects, tailored, location→project→price'},
  {id:'objections',label:'Objection Handling',max:15,desc:'LAER — Listen, Acknowledge, Explore, Respond'},
  {id:'communication',label:'Communication',max:10,desc:'Tone, pacing, active listening'},
  {id:'followup',label:'Follow-up & Closing',max:10,desc:'Specific next step confirmed before ending'},
  {id:'overall_prof',label:'Professionalism',max:5,desc:'Product knowledge, brand representation'}
];

const DIM_CHECKLIST={greeting:[
{pass:"Agent greeted with energy and positivity",fail:"Did NOT greet with energy — call started flat",thr:75},
{pass:"Agent used the client name in greeting",fail:"Did NOT use client name — impersonal opening",thr:65},
{pass:"Agent introduced full name clearly",fail:"Did NOT introduce name — client does not know who called",thr:50},
{pass:"Agent introduced company (DAMAC) and role",fail:"Did NOT mention DAMAC or role upfront",thr:50},
{pass:"Agent did NOT jump straight into pitch",fail:"Agent jumped straight into pitch — no warm-up",thr:60},
{pass:"Agent set a warm and friendly opening tone",fail:"Tone was cold or too formal from the start",thr:70}
],profiling:[
{pass:"Agent confirmed client is the decision-maker",fail:"Did NOT confirm if client is the decision-maker",thr:75},
{pass:"Agent asked about financial capability",fail:"Did NOT ask about financial capability",thr:65},

function fixRow(r){
  let b={...r};
  if(r.full_json&&typeof r.full_json==='string'&&r.full_json.length>20){try{const p=JSON.parse(r.full_json);b={...r,...p};}catch(e){}}
  ['scores','scoreComments','strengths','gaps','coachingTips','sopViolations','ruleFlags','customerProfile','callIntelligence','sopAnalysis','metadata'].forEach(k=>{if(typeof b[k]==='string'&&(b[k][0]==='{' || b[k][0]==='[')){try{b[k]=JSON.parse(b[k]);}catch(e){}}});
  const d=new Date(b.timestamp||b.call_date||'');
  b.month=isNaN(d)?'Unknown':d.toLocaleString('en-GB',{month:'long',year:'numeric'});
  b.pct=Number(b.pct)||0;b.total=Number(b.total)||0;
  b.rm_name=b.agentName||b.rm_name||'Unknown';
  b.scores=b.scores||b.sopAnalysis?.scores||{};
  b.scoreComments=b.scoreComments||b.sopAnalysis?.score_comments||{};
  b.strengths=b.strengths||b.sopAnalysis?.strengths||[];
  b.gaps=b.gaps||b.sopAnalysis?.gaps||[];
  b.coachingTips=b.coachingTips||b.sopAnalysis?.coaching_tips||[];
  const rawFlags=b.ruleFlags||b.sopAnalysis?.rule_flags||[];
b.ruleFlags=rawFlags.map(f=>{
  if(!f)return null;
  if(typeof f==='string')return f;
  const rule=f.rule||f.rule_id||f.id||f.code||'';
  const desc=f.description||f.violation||f.detail||f.message||f.text||'';
  return rule&&desc?`${rule}: ${desc}`:rule||desc||JSON.stringify(f);
}).filter(Boolean);
  b.customerProfile=b.customerProfile||{};
  b.callIntelligence=b.callIntelligence||{};
  return b;
}

function filtered(){
  let d=[...ALL];
  if(S.fHOS)d=d.filter(r=>r.hos_name===S.fHOS);
  if(S.fDOS)d=d.filter(r=>r.dos_name===S.fDOS);
  if(S.fRM)d=d.filter(r=>r.rm_name===S.fRM);
  if(S.fMonth)d=d.filter(r=>r.month===S.fMonth);
  if(S.fOut)d=d.filter(r=>r.callOutcome===S.fOut);
  if(S.fSearch){const s=S.fSearch.toLowerCase();d=d.filter(r=>(r.rm_name||'').toLowerCase().includes(s)||(r.dos_name||'').toLowerCase().includes(s)||(r.hos_name||'').toLowerCase().includes(s)||(r.customerProfile?.customer_name||'').toLowerCase().includes(s)||(r.inquiry_id||'').toLowerCase().includes(s));}
  const sg=S.fSeg||S.fQ;
  if(sg){const ra={};ALL.forEach(r=>{if(!ra[r.rm_name])ra[r.rm_name]=[];ra[r.rm_name].push(r.pct);});const rs={};Object.entries(ra).forEach(([rm,ps])=>{rs[rm]=seg(Math.round(ps.reduce((a,b)=>a+b,0)/ps.length));});if(sg==='attn')d=d.filter(r=>['below','crit'].includes(rs[r.rm_name]||'avg'));else d=d.filter(r=>rs[r.rm_name]===sg);}
  return d;
}

async function ensureDetail(c){
  if(!c||c.__detailLoaded)return;
  const fname=((c.URL||c.htmlUrl||'').split('/').pop())||c.htmlFileName||'';
  if(!fname){c.__detailLoaded=true;return;}
  try{
    const res=await fetch(DETAIL_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:fname}),signal:AbortSignal.timeout(30000)});
    const txt=await res.text();
    const d=txt.trim()?JSON.parse(txt.trim().replace(/^=/,'')):null;
    if(d&&d.full_json){
      c.full_json=d.full_json;
      const fixed=fixRow({...c});
      Object.assign(c,fixed);
    }
  }catch(e){console.warn('Detail load failed for',fname,e);}
  c.__detailLoaded=true;
}

async function reloadWithRange(from,to){
  try{
    const res=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:from||'',to:to||''}),signal:AbortSignal.timeout(180000)});
    const txt=await res.text();
    const raw=txt.trim()?JSON.parse(txt.trim().replace(/^=/,'')):{calls:[]};
    const arr=Array.isArray(raw)?raw:(raw.calls||raw.reviews||raw.data||[]);
    if(!arr.length){
      // Nothing processed for this range yet — offer to process now
      document.getElementById('dr-status').textContent='No processed calls in this range yet.';
      if(confirm('No analyzed calls found for '+from+' → '+to+'.\n\nRun AI analysis on this date range now?\n\n(Takes ~1-2 min per call — new calls appear as they finish)')){
        await fetch('https://aihub.damacgroup.com/webhook/damac-process-range',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from,to})});
        document.getElementById('dr-status').textContent='⚙️ AI processing started! Click "View this range" again in a few minutes.';
      }
      return;
    }
    ALL=arr.map(fixRow);IS_LIVE=true;
    document.getElementById('dr-status').textContent='Showing '+ALL.length+' calls in range';
    renderSB();renderMain();
  }catch(e){
    document.getElementById('dr-status').textContent='Error: '+e.message;
  }
}

async function processDateRange(){
  const from=document.getElementById('dr-from').value;
  const to=document.getElementById('dr-to').value;
  if(!from||!to){document.getElementById('dr-status').textContent='Pick BOTH dates to process';return;}
  if(!confirm('Process all calls from '+from+' to '+to+' with AI?\n\nThis runs in the background and may take a while (~1-2 min per call). New calls will appear in the dashboard as they finish.'))return;
  try{
    await fetch('https://aihub.damacgroup.com/webhook/damac-process-range',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from,to})});
    document.getElementById('dr-status').textContent='⚙️ Processing started! Refresh in a few minutes to see new calls.';
  }catch(e){
    document.getElementById('dr-status').textContent='Trigger failed: '+e.message;
  }
}

function statsBar(data){
  const t=data.length,rms=uRMs(data);
  const avg=t?Math.round(data.reduce((a,b)=>a+b.pct,0)/t):0;
  const book=data.filter(r=>r.callOutcome==='meeting_booked').length;
  const hot=data.filter(r=>r.customerProfile?.lead_quality==='hot').length;
  const needs=rms.filter(rm=>rmAvg(rm,data)<40).length;
  return`<div class="stats">
    <div class="sc"><div class="sc-l">Calls reviewed</div><div class="sc-v" style="color:var(--gold)">${t.toLocaleString()}</div><div class="sc-s">${t} records</div></div>

    <div class="sc"><div class="sc-l">Meetings booked</div><div class="sc-v" style="color:#16a34a">${book}</div><div class="sc-s">${t?Math.round(book/t*100):0}% conversion</div></div>
    <div class="sc"><div class="sc-l">Need attention</div><div class="sc-v" style="color:#dc2626">${needs}</div><div class="sc-s">Scoring below 40%</div></div>

function renderHome(){
  const data=filtered();
  const dosList=uDOS(data).sort();
  const allRMs=uRMs(data).sort((a,b)=>rmAvg(b,data)-rmAvg(a,data)).slice(0,10);
  const medals=['🥇','🥈','🥉'];
  const lbRows=allRMs.map((rm,i)=>{
    const rc=data.filter(r=>r.rm_name===rm);
    const avg=rmAvg(rm,data);
    const book=rc.filter(r=>r.callOutcome==='meeting_booked').length;
    return`<div class="lb-row" onclick="openRM('${rm.replace(/'/g,"\\'")}')">
      <div class="lb-rank">${medals[i]||i+1}</div>
      <div class="lb-info">
        <div class="lb-name">${rm}</div>
        <div class="lb-sub">${rc[0]?.dos_name||'—'} → ${rc[0]?.hos_name||'—'} · ${rc.length} calls · ${book} meetings</div>
      </div>
      <div class="lb-score" style="${tc(avg)}">${avg}%</div>
    </div>`;}).join('');
  const cards=dosList.map(dos=>{
    const dc=data.filter(r=>r.dos_name===dos);

// =================== CONVERSATION BUBBLE BUILDER ===================
function convBubble(speaker, role, text, issue, assessment, correctScript){
  // speaker: name, role: 'rm'|'cu', text: the actual quote, issue: optional issue text, assessment: 'good'|'bad'|'neutral', correctScript: optional better script
  const isRM = role === 'rm';
  const avClass = isRM ? 'conv-av-rm' : 'conv-av-cu';
  const bubbleClass = isRM ? `conv-bubble-rm ${assessment === 'bad' ? 'bad' : assessment === 'good' ? 'good' : ''}` : 'conv-bubble-cu';
  const initials = isRM ? 'RM' : 'CU';
  return `<div class="conv-msg">
    <div class="conv-av ${avClass}">${initials}</div>
    <div class="conv-bubble ${bubbleClass}">
      <div class="conv-speaker">
        <span style="color:${isRM ? '#b8943a' : '#0ea5e9'}">${isRM ? '🎙 Agent' : '👤 Customer'} — ${speaker}</span>
        ${assessment === 'bad' ? '<span style="color:#dc2626;font-weight:700">❌ Issue</span>' : assessment === 'good' ? '<span style="color:#16a34a;font-weight:700">✅ Good</span>' : ''}
      </div>
      <div class="conv-quote">"${text}"</div>
      ${issue ? `<div class="conv-issue ${assessment === 'bad' ? 'bad' : assessment === 'good' ? 'good' : ''}">→ ${issue}</div>` : ''}
      ${correctScript ? `<div class="conv-correct"><div class="conv-correct-lbl">✓ Better script</div>${correctScript}</div>` : ''}
    </div>
  </div>`;
}

              </div>
            ` : `
              <div style="margin:10px 0;padding:10px 12px;background:rgba(0,0,0,.02);border:1px dashed var(--br2);border-radius:var(--rs);font-size:11px;color:var(--t3);font-style:italic;text-align:center">
                ⓘ No transcript quotes captured for this stage by the AI
              </div>
            `}

            <div style="font-size:11px;color:var(--t2);line-height:1.6;margin:8px 0;padding:8px 12px;background:rgba(0,0,0,.02);border-radius:4px;border-left:3px solid ${stage.flag?.type==='bad'?'#dc2626':stage.flag?.type==='warn'?'#ca8a04':'#16a34a'}"><strong>AI assessment:</strong> ${stage.text}</div>

            <div style="font-size:11px;color:var(--tx);line-height:1.6;margin-bottom:8px">${stage.detail}</div>

            ${stage.correct_script && stage.flag ? `<div class="conv-correct" style="margin-top:0"><div class="conv-correct-lbl">✓ What the agent should say instead</div>${stage.correct_script}</div>` : ''}

            ${stage.flag?`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs);margin-top:8px;background:${stage.flag.type==='bad'?'var(--rdb)':'var(--amb)'};border:1px solid ${stage.flag.type==='bad'?'rgba(220,38,38,.25)':'rgba(202,138,4,.25)'}"><span style="font-size:14px">${stage.flag.type==='bad'?'❌':'⚠'}</span><span style="font-size:12px;font-weight:600;color:${stage.flag.type==='bad'?'#dc2626':'#ca8a04'}">${stage.flag.text}</span></div>`:''}
          </div>
        </div>
      `}).join('')}

      <div style="padding:16px;background:var(--s2);border-radius:var(--rs);margin-top:8px;border:1px solid var(--br)">
        <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px">SOP Evaluation Summary — This Call</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          ${DIMS.map(d=>{const s2=Number(sc2?.[d.id])||0;const p=Math.round(s2/d.max*100);const comment=c.scoreComments?.[d.id]||'';return`<div style="padding:8px 10px;background:${p>=70?'rgba(22,163,74,.05)':'rgba(220,38,38,.05)'};border:1px solid ${p>=70?'rgba(22,163,74,.15)':'rgba(220,38,38,.15)'};border-radius:4px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px"><span style="font-size:11px;font-weight:600;color:${p>=70?'#16a34a':'#dc2626'}">${p>=70?'✓':'✗'} ${d.label}</span><span style="font-size:11px;font-weight:700;color:${bc(p)}">${s2}/${d.max}</span></div>${comment?`<div style="font-size:10px;color:var(--t2);line-height:1.4">${comment}</div>`:''}</div>`;}).join('')}
        </div>
        <div style="padding:10px 14px;background:${c.pct>=70?'var(--gnb)':c.pct>=40?'var(--amb)':'var(--rdb)'};border-radius:var(--rs);display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:13px;font-weight:700">Total: ${c.total}/100</div><div style="font-size:11px;color:var(--t2);margin-top:2px">${flags.length} violations · ${c.callOutcome==='meeting_booked'?'Meeting booked ✅':'No meeting booked'}</div></div><div style="font-size:36px;font-weight:700;${tc(c.pct)}">${c.pct}%</div></div>
      </div>`;
  }
  const el=document.getElementById('call-tab-content');
  if(el)el.innerHTML=html;
}

function hlQ(text, mode){
  if(!text)return text;
  return text
    .replace(/"([^"]{3,120})"/g,(m,q)=>{
      const col=mode==='good'?'rgba(22,163,74,.1)':mode==='bad'?'rgba(220,38,38,.1)':mode==='tip'?'rgba(14,165,233,.1)':'rgba(202,138,4,.1)';
      const border=mode==='good'?'rgba(22,163,74,.25)':mode==='bad'?'rgba(220,38,38,.25)':mode==='tip'?'rgba(14,165,233,.25)':'rgba(202,138,4,.25)';
      const color=mode==='good'?'#16a34a':mode==='bad'?'#dc2626':mode==='tip'?'#0ea5e9':'#ca8a04';
      return`<span style="display:inline-block;background:${col};border:1px solid ${border};border-radius:4px;padding:2px 7px;font-style:italic;color:${color};font-size:11px;margin:1px 2px;line-height:1.5">"${q}"</span>`;
    });
}

async function init(){
  document.getElementById('main').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px">
      <div style="width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#b8943a;border-radius:50%;animation:spin .7s linear infinite"></div>
      <div style="font-size:13px;color:#6b7280" id="loadMsg">Connecting to DAMAC backend...</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  renderSB();
  const msgs=['Fetching call reviews...','Reading Google Sheets...','Parsing records...','Almost there...'];
  let mi=0;const ticker=setInterval(()=>{mi++;const el=document.getElementById('loadMsg');if(el&&msgs[mi])el.textContent=msgs[mi];},3000);
  try{
    const res=await fetch(WEBHOOK,{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:'{}',
  signal:AbortSignal.timeout(180000)
});
    clearInterval(ticker);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const txt=await res.text();
    const raw=txt.trim()?JSON.parse(txt.trim().replace(/^=/,'')):{calls:[]};
    const arr=Array.isArray(raw)?raw:(raw.calls||raw.reviews||raw.data||[]);
    if(!arr.length)throw new Error('Empty');
    ALL=arr.map(fixRow);IS_LIVE=true;
  }catch(e){
    clearInterval(ticker);console.warn('Webhook:',e.message,'→ demo');
    IS_LIVE=false;ALL=buildMock();
  }
  renderSB();renderMain();
}


function buildMock(){
  const H={'Abhishek Sarda':{'SYED FARID':['Tithi Singh','Shane Driscoll','Cristian Camilo','Urmila Motaiah'],'Niaz Mohammad':['Haseeb Ahmed','Shoeab Khan','Abdur Rehman','Carlos Castillo'],'Mirsaid Mirsaidov':['Umar Kamil','Nadir Ulanov']},'Pranay Gupta':{'Imad Maalouf':['Sahaj Arora','Neda Bahramimeimandi','Andreea Duta'],'Ahmad Aoun':['Mirette Beshay']},'Gulshan Soni':{'Gaurav Beri':['Ahed Thabateh']},'Samir Arora':{'Mohammad Hassan':['Rohit Katare','Yousef Albarakat'],'Kapil Chopra':['Hassan Zaman']},'Amin Ali':{'Mohamed Elnaggar':['Ravi Mahawal'],'Aisa Goorkani':['Mohammad Pour']}};
  const records=[];let idx=0;
  const NAMES=['Ahmed Al Rashid','Priya Sharma','James Wilson','Li Wei','Maria Santos','Omar Khalid','Sarah Johnson','Ravi Kumar','Anna Mueller','Fatima Al Zaabi'];
  const NATS=['India','UAE','UK','Saudi Arabia','Pakistan','USA','Egypt','Germany'];
  const PROJ=['DAMAC Islands','Cavalli Tower','DAMAC Lagoons','DAMAC Hills 2','Riverside Views'];
  const OBJS=['Price above initial budget','Needs to compare options','Wants to visit first','Off-plan concern'];
  const DISC=['Investment purpose confirmed','Budget range discussed','Property type preference','Payment plan options','Location shortlist','Timeline to buy'];
  const MISS=['Finance type not confirmed','Exact timeline not captured','Decision-maker not confirmed','Location preference unclear'];
  function sr(s){let x=s;return function(){x=(x*9301+49297)%233280;return x/233280;};}

  // Sample agent/customer quotes for each stage — varies by performance
  function buildCallTimeline(scores, custName, nat, bud, projs, custType, objections, rng) {
    const tl = [];
    

    // GREETING
    const grPct = scores.greeting / 10;
    if (grPct >= 0.7) {
      tl.push({
        stage: 'greeting',
        what_agent_said: `Good morning ${custName}, this is ${['Rohit','Hassan','Sahaj','Mohammad','Ahmed'][Math.floor(rng()*5)]} calling from DAMAC Properties — how are you doing today?`,
        what_customer_said: `Hi, yes I'm doing well thank you. I had submitted an inquiry on your website yesterday.`,
        assessment: 'good',
        issue: null,
        score: `${scores.greeting}/10`
      });

  
    } else {
      tl.push({
        stage: 'greeting',
        what_agent_said: `Hello, am I speaking with ${custName}? So you wanted to know about our properties?`,
        what_customer_said: `Yes... who is this? Where are you calling from?`,
        assessment: 'bad',
        issue: 'Agent did not introduce themselves by name or mention DAMAC. The customer had to ask who was calling — immediately reducing trust.',
        what_should_be_said: `Good [time of day] ${custName}, this is [Your Name] calling from DAMAC Properties — how are you today? I'm reaching out about the inquiry you submitted yesterday.`,
        score: `${scores.greeting}/10`
      });
    }

    // PROFILING
    const prPct = scores.profiling / 15;
    if (prPct >= 0.6) {
      tl.push({
        stage: 'profiling',
        what_agent_said: `Before I share some options, may I ask — is this your first investment in Dubai? And will you be the sole decision-maker on this purchase, or do you discuss with family?`,
        what_customer_said: `It's my second property actually, the first one was in Downtown. I make the decision but I discuss with my wife.`,
        customer_intent: 'Customer is an experienced buyer with established Dubai exposure — high-value lead.',
        assessment: 'good',
        score: `${scores.profiling}/15`
      });
    } else {
      tl.push({
        stage: 'profiling',
        what_agent_said: `So what kind of property are you looking for?`,
        what_customer_said: `Well, I was thinking apartment but I'm not sure...`,
        assessment: 'bad',
        issue: 'Agent jumped directly to product questions without building rapport or understanding the customer\'s background, decision-making process, or financial capability.',
        what_should_be_said: `Before we discuss properties, may I ask — is this your first time looking at Dubai property? Will you be the sole decision-maker? And what brings you to Dubai right now?`,
        score: `${scores.profiling}/15`
      });
    }

    // PROBING / REQUIREMENT ID
    const pbPct = scores.probing / 20;
    if (pbPct >= 0.6) {
      tl.push({
        stage: 'probing',
        what_agent_said: `Great. So to make sure I find you the perfect option — what's your budget range? And are you looking at it as an investment for rental returns, or for your own use? Cash or mortgage?`,
        what_customer_said: `Budget is around ${(bud/1000000).toFixed(1)} million, mostly for investment but I might use it sometimes. I'll pay cash. Timeline is within 3 months.`,
        assessment: 'good',
        score: `${scores.probing}/20`
      });
      tl.push({
        stage: 'probing',
        what_agent_said: `So just to confirm — you're looking for an investment property around AED ${(bud/1000000).toFixed(1)}M, cash payment, ready to move forward in 3 months, primarily for rental income — is that all correct?`,
        what_customer_said: `Yes, that's exactly right.`,
        assessment: 'good',
        issue: 'Excellent SOP execution — agent summarized requirements and got explicit confirmation before presenting.',
        score: 'Bonus +5'
      });
    } else {

      tl.push({
        stage: 'probing',
        what_agent_said: `OK so let me tell you about DAMAC Islands — it's our latest waterfront project, starting from AED 1.8 million...`,
        what_customer_said: `Wait, but I haven't told you my budget yet...`,
        assessment: 'bad',
        issue: 'Agent jumped to project pitch without capturing budget, finance type, timeline, or location preference. This is the #1 SOP violation at DAMAC — presenting blind.',
        what_should_be_said: `Before I share any options, I need to understand what you're looking for. What's your budget range? Are you buying as an investment or for your own use? Cash or mortgage? Which areas interest you? And how soon are you looking to move forward?`,
        score: `${scores.probing}/20`
      });
    }

    // PRESENTATION
    const psPct = scores.presentation / 15;
    if (psPct >= 0.6 && projs.length <= 2) {
      tl.push({
        stage: 'presentation',
        what_agent_said: `Based on what you've told me, I'd recommend ${projs[0]} for you specifically. It's in a prime ${cp_area(rng)} location, generates 7-8% rental yield, and starts at AED ${(bud*0.9/1000000).toFixed(1)}M for a 2BR. The payment plan is 60/40 — 60% during construction, 40% on handover. Given you're cash buyer, you also get an additional 5% discount.`,
        what_customer_said: `That sounds interesting. What's the expected handover date? And what's the rental potential after handover?`,
        assessment: 'good',
        issue: 'Tailored presentation with location → project → financials in correct order, with rental yield emphasized for investor profile.',
        score: `${scores.presentation}/15`
      });
    } else {
      tl.push({
        stage: 'presentation',
        what_agent_said: `So we have ${projs.join(', ')} — also DAMAC Lagoons, Cavalli Tower, Safa One, DAMAC Hills... they all have different features. Cavalli Tower starts at 5 million, Lagoons starts at 1.5 million, Islands has villas from 8 million...`,
        what_customer_said: `That's a lot of options... I'm getting confused. Can you just tell me which one is best?`,
        assessment: 'bad',
        issue: `Agent presented ${projs.length > 2 ? projs.length + ' projects which is far above the SOP maximum of 2' : 'too many options without tailoring to customer profile'}. The customer became overwhelmed — classic decision paralysis. Pricing was also led with rather than value-built first.`,
        what_should_be_said: `Based on your investment profile and budget of AED ${(bud/1000000).toFixed(1)}M, I'd recommend just two options: ${projs[0] || 'Project A'} for [reason 1] and ${projs[1] || 'Project B'} for [reason 2]. Let me walk you through the first one in detail.`,
        score: `${scores.presentation}/15`
      });
    }

    // OBJECTIONS (if any)
    if (objections.length > 0) {
      const objPct = scores.objections / 15;
      if (objPct >= 0.6) {
        tl.push({
          stage: 'objection',
          what_customer_said: `Honestly, the price feels a bit high compared to what I was expecting. ${objections[0]}.`,
          what_agent_said: `I completely understand your concern, ${custName}. Can I ask — when you say the price feels high, is it the overall ticket size, or are you comparing it to a specific other project? Because if it's about value, our 7.5% guaranteed rental yield for the first 3 years actually makes the effective cost lower than comparable projects in the area.`,
          customer_intent: 'Customer raising price-based objection — likely negotiable if value is reframed.',
          assessment: 'good',
          issue: 'Strong LAER application — Listened, Acknowledged, Explored root cause, then Responded with hard facts (guaranteed yield).',
          score: `${scores.objections}/15`
        });
      } else {
        tl.push({
          stage: 'objection',
          what_customer_said: `Honestly, the price feels a bit high. ${objections[0]}.`,
          what_agent_said: `Yeah, I understand. But trust me sir, DAMAC is the best developer in Dubai, you won't find a better deal anywhere. Just take it.`,
          customer_intent: 'Customer raising price objection — needs proper handling.',
          assessment: 'bad',
          issue: 'Agent dismissed objection with generic reassurance ("trust me"). No exploration of WHY customer feels the price is high — could be budget issue, competitor comparison, or value not communicated. Pressure-selling never works on educated buyers.',
          what_should_be_said: `I completely understand. Can I ask — when you say the price feels high, is it that the total amount exceeds your budget, or are you comparing it to a specific other project you've seen? Understanding that will help me suggest the right option for you.`,
          score: `${scores.objections}/15`
        });
      }
    }

    // CLOSING
    const clPct = scores.followup / 10;
    if (clPct >= 0.6) {
      tl.push({
        stage: 'closing',
        what_agent_said: `So to summarize — I'll send you the full floor plans for the 2BR at ${projs[0] || 'the project'} on WhatsApp by 5 PM today, along with the payment plan and ROI calculations. Then let's schedule a site visit for Saturday at 11 AM — I'll personally show you the show unit. Does Saturday at 11 work for you?`,
        what_customer_said: `Saturday 11 AM works. Send the details on WhatsApp, my number is the same one you called.`,
        assessment: 'good',
        issue: 'Excellent closing — specific deliverable, specific time, specific next meeting confirmed with explicit customer agreement.',
        score: `${scores.followup}/10`
      });
    } else {
      tl.push({
        stage: 'closing',
        what_agent_said: `OK so I will send you some details and we'll be in touch. Have a nice day!`,
        what_customer_said: `Sure, OK... bye.`,
        assessment: 'bad',
        issue: 'No specific next step, no deliverable promised, no follow-up time confirmed. Lead will go cold within 48 hours — customer has no reason to wait for this agent vs talking to a competitor.',
        what_should_be_said: `Before we end the call — I'll send you the floor plans and payment plan on WhatsApp by [specific time today]. Let's schedule a site visit for [specific day] at [specific time]. Can I confirm that with you now?`,
        score: `${scores.followup}/10`
      });
    }

    return tl;
  }

  function cp_area(rng) {
    return ['waterfront','Marina','Business Bay','Hills','beachfront'][Math.floor(rng()*5)];
  }

  Object.entries(H).forEach(([hos,dosMap])=>{
    Object.entries(dosMap).forEach(([dos,rms])=>{
      rms.forEach(rm=>{
        const rng=sr(rm.charCodeAt(0)*31+rm.length*17+idx*7);
        const base=25+Math.floor(rng()*60);
        for(let c=0;c<4+Math.floor(rng()*5);c++){
          const cr=sr(idx*137+c*53+rm.charCodeAt(0));
          const scores={greeting:Math.max(0,Math.min(10,Math.round(base/10+cr()*4-2))),profiling:Math.max(0,Math.min(15,Math.round(base/100*15+cr()*6-3))),probing:Math.max(0,Math.min(20,Math.round(base/100*20+cr()*8-4))),presentation:Math.max(0,Math.min(15,Math.round(base/100*15+cr()*6-3))),objections:Math.max(0,Math.min(15,Math.round(base/100*15+cr()*6-3))),communication:Math.max(0,Math.min(10,Math.round(base/10+cr()*4-2))),followup:Math.max(0,Math.min(10,Math.round(base/10+cr()*4-2))),overall_prof:Math.max(0,Math.min(5,Math.round(base/100*5+cr()*2-1)))};
          const total=Object.values(scores).reduce((a,b)=>a+b,0);
          const nat=NATS[Math.floor(cr()*NATS.length)];
          const bud=Math.round((1+cr()*4)*500000);
          const outcome=['meeting_booked','interested_not_committed','not_interested','meeting_booked','interested_not_committed'][Math.floor(cr()*5)];
          const lq=cr()>0.7?'hot':cr()>0.4?'warm':'cold';
          const date=new Date(2026,4,1+Math.floor(cr()*27));
          const dur=600+Math.floor(cr()*1800);
          const projs=PROJ.slice(0,1+Math.floor(cr()*3));
          const custName=NAMES[Math.floor(cr()*NAMES.length)];
          const custType=cr()>0.5?'investor':'end_user';
          const callObjections = cr()>0.4 ? [OBJS[Math.floor(cr()*OBJS.length)]] : [];
          const flags=[];
          if(scores.greeting<4)flags.push('RULE_01: No proper introduction at call start');
          if(scores.probing<8)flags.push('RULE_04: Requirements not summarized before presenting');
          if(scores.followup<4)flags.push('RULE_08: No specific next step confirmed');
          if(scores.objections<5)flags.push('RULE_07: Objection not handled properly');
          if(projs.length>2 && scores.presentation<10)flags.push('RULE_05: More than 2 projects presented');
          
          const callTimeline = buildCallTimeline(scores, custName, nat, bud, projs, custType, callObjections, cr);
          
          records.push({
            id:'DEMO-'+String(idx).padStart(4,'0'),
            rm_name:rm,agentName:rm,dos_name:dos,hos_name:hos,
            month:'June 2026',timestamp:date.toISOString(),duration:dur,
            total,maxTotal:100,pct:total,callOutcome:outcome,
            inquiry_id:'IQ-'+Math.floor(8000000+cr()*2000000),
            scores,
            scoreComments:{greeting:scores.greeting<5?'Agent did not open with a proper greeting or self-introduction.':'Warm, energetic opening with name and role clearly stated.',profiling:scores.profiling<8?'Financial capability and decision-maker status not fully confirmed.':'Good financial profiling. Decision-maker confirmed.',probing:scores.probing<10?'Budget confirmed but finance type and timeline not captured before presenting.':'Strong requirement identification with summary before presenting.',presentation:scores.presentation<8?'Presentation was generic. Not tailored to client profile.':'Clear, tailored presentation based on requirements.',objections:scores.objections<8?'Objection raised but root cause not fully explored.':'LAER used effectively.',communication:scores.communication<5?'Pacing was too fast at times.':'Clear, professional communication throughout.',followup:scores.followup<5?'No specific next step confirmed before ending.':'Specific next step confirmed before call ended.',overall_prof:scores.overall_prof<3?'Needs improvement in product knowledge depth.':'Professional conduct throughout.'},
            callSummary:`Agent spoke with ${custName} (${nat}). Budget ${fmtB(bud)}. ${projs.join(', ')} discussed. Outcome: ${outLbl(outcome)}. ${outcome==='meeting_booked'?'Site visit confirmed.':'Follow-up required.'}`,
            strengths:scores.presentation>=10?['Strong project presentation skills','Good product knowledge']:scores.communication>=7?['Clear communication throughout','Professional tone maintained']:['Attempted client profiling','Reasonable rapport building'],
            gaps:scores.followup<5?['No specific next step confirmed before ending','Weak call closing']:scores.probing<10?['Incomplete requirement capture','No summary before presenting']:['Could improve objection handling','LAER not consistently applied'],
            coachingTips:['Always confirm a specific next step before ending — a date and time, not "I\'ll send something".','Summarize requirements out loud before presenting any project.','Use LAER for every objection raised by the client.'],
            ruleFlags:flags,
            customerProfile:{customer_name:custName,nationality:nat,customer_type:custType,budget_aed:bud,finance_type:cr()>0.5?'self_finance':'mortgage',property_preference:['apartment','villa','townhouse'][Math.floor(cr()*3)],bedrooms_requested:['1BR','2BR','3BR','4BR'][Math.floor(cr()*4)],location_preference:['Dubai Marina','Business Bay','Downtown','DAMAC Hills','JVC'][Math.floor(cr()*5)],timeline:['immediate','3_months','6_months','1_year'][Math.floor(cr()*4)],lead_quality:lq,first_time_dubai:cr()>0.5},
            callIntelligence:{
              call_summary:`${custName} (${nat}) contacted DAMAC. Budget ${fmtB(bud)}. Interested in ${projs.join(' and ')} for ${custType==='investor'?'investment':'personal use'}. Call lasted ${Math.round(dur/60)} minutes. ${outcome==='meeting_booked'?'Site visit confirmed.':'No firm commitment made.'}`,
              what_was_discussed:DISC.slice(0,2+Math.floor(cr()*4)),
              what_is_missing:MISS.slice(0,1+Math.floor(cr()*3)),
              projects_mentioned:projs,
              objections_raised:callObjections.length?callObjections:['No major objections'],
              next_steps:outcome==='meeting_booked'?'Site visit confirmed for next available slot':scores.followup>=5?'WhatsApp follow-up scheduled':null,
              call_outcome:outcome,
              call_timeline: callTimeline
            }
          });
          idx++;
          
        }
      });
    });
  });
  return records;
}

init();
</script>
